<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071427"/>
      <stop offset="1" stop-color="#132A46"/>
    </linearGradient>
    <linearGradient id="base" x1="420" y1="260" x2="1180" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E6EDF7"/>
      <stop offset="1" stop-color="#C8D4E5"/>
    </linearGradient>
    <linearGradient id="ui" x1="480" y1="320" x2="1120" y2="730" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9F0FA"/>
    </linearGradient>
    <linearGradient id="mid3d" x1="600" y1="380" x2="1020" y2="690" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1D2E46"/>
      <stop offset="1" stop-color="#0C1628"/>
    </linearGradient>
    <linearGradient id="modal" x1="730" y1="330" x2="1260" y2="650" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#DCE8F7"/>
    </linearGradient>
    <filter id="shadow" x="280" y="180" width="1040" height="720" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="25" stdDeviation="24" flood-color="#020812" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="560" y="320" width="620" height="430" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#081220" flood-opacity="0.48"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <ellipse cx="820" cy="860" rx="470" ry="70" fill="#0A1525" fill-opacity="0.58"/>

  <g stroke="#6E86A8" stroke-opacity="0.42" stroke-width="2">
    <path d="M330 250H700V320"/>
    <path d="M1260 350H1420V500"/>
    <path d="M1220 760H1410V680"/>
    <path d="M270 600H450V690"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="360" y="240" width="860" height="560" rx="40" fill="url(#base)" transform="matrix(0.96 0.22 -0.30 0.95 180 -130)"/>
  </g>

  <rect x="470" y="330" width="660" height="390" rx="26" fill="url(#ui)" transform="matrix(0.96 0.22 -0.30 0.95 200 -120)" stroke="#AEC1D9" stroke-opacity="0.7"/>
  <rect x="575" y="405" width="430" height="250" rx="22" fill="url(#mid3d)" transform="matrix(0.96 0.22 -0.30 0.95 220 -105)" opacity="0.93"/>

  <g filter="url(#soft)">
    <rect x="720" y="350" width="520" height="310" rx="24" fill="url(#modal)" transform="matrix(0.96 0.22 -0.30 0.95 255 -150)" stroke="#C1D3EA"/>
  </g>

  <rect x="780" y="430" width="160" height="26" rx="8" fill="#8EA3C0" opacity="0.42" transform="matrix(0.96 0.22 -0.30 0.95 255 -150)"/>
  <rect x="785" y="474" width="280" height="20" rx="7" fill="#9DB1CB" opacity="0.34" transform="matrix(0.96 0.22 -0.30 0.95 255 -150)"/>
  <rect x="785" y="506" width="220" height="20" rx="7" fill="#9DB1CB" opacity="0.3" transform="matrix(0.96 0.22 -0.30 0.95 255 -150)"/>
  <rect x="792" y="548" width="120" height="42" rx="12" fill="#4A7FCE" transform="matrix(0.96 0.22 -0.30 0.95 255 -150)"/>
  <rect x="930" y="548" width="120" height="42" rx="12" fill="#48A77B" transform="matrix(0.96 0.22 -0.30 0.95 255 -150)"/>

  <g font-family="Segoe UI, Arial, sans-serif" font-weight="600" fill="#E9F1FC">
    <text x="250" y="238" font-size="34">Layer Stack (Front to Back)</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-weight="600" font-size="24" fill="#F5FAFF">
    <rect x="185" y="252" width="300" height="70" rx="14" fill="#1A2E4A" fill-opacity="0.92" stroke="#7F9FC3"/>
    <text x="208" y="297">1) Modal UI (top z-index)</text>

    <rect x="1280" y="472" width="230" height="70" rx="14" fill="#1A2E4A" fill-opacity="0.92" stroke="#7F9FC3"/>
    <text x="1302" y="517">2) 3D Overlay Pass</text>

    <rect x="1250" y="650" width="260" height="70" rx="14" fill="#1A2E4A" fill-opacity="0.92" stroke="#7F9FC3"/>
    <text x="1272" y="695">3) Base UI Pass</text>

    <rect x="160" y="650" width="330" height="70" rx="14" fill="#1A2E4A" fill-opacity="0.92" stroke="#7F9FC3"/>
    <text x="182" y="695">4) Base 3D Card World Pass</text>
  </g>
</svg>
