[workspace]
resolver = "3"
members = [
    "Bevy/Crates/Game",
    "Bevy/Crates/Shared",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/SamuelAsherRivello/bevy-card-game"

[workspace.dependencies]
bevy = "0.18.1"
bevy-inspector-egui = "0.36.0"
bevy_card_game_shared = { path = "Bevy/Crates/Shared" }

[profile.dev]
debug = 1
incremental = true

[profile.dev.package."*"]
debug = 0
