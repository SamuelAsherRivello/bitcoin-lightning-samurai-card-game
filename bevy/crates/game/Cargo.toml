[package]
name = "bevy-card-game"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
asset-hot-reload = ["bevy/file_watcher"]
desktop-hot-reload = ["dep:bevy_hotpatching_experiments"]
fast-dev = ["bevy/dynamic_linking"]

[dependencies]
bevy.workspace = true
bevy_aspect_ratio_mask.workspace = true
bevy-inspector-egui.workspace = true
bevy-persistent = { version = "0.10.0", features = ["json", "pretty"] }
bevy_card_game_shared.workspace = true
bevy_hotpatching_experiments = { version = "0.4.0", optional = true }
fastrand = "2.4.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3.98", features = ["Document", "Element", "Window"] }
