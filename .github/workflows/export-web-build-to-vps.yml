name: ReleaseWebBuildToVps

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_version:
        description: Optional release folder name. Leave blank to use VERSION.txt.
        required: false

permissions:
  contents: read

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy release web app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_version || github.ref }}

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          release_version="${{ github.event.release.tag_name || inputs.release_version }}"
          if [ -z "${release_version}" ]; then
            if [ ! -f VERSION.txt ]; then
              echo "::error::Release version was blank and VERSION.txt does not exist."
              exit 1
            fi
            version="$(tr -d '[:space:]' < VERSION.txt)"
            release_version="v${version}"
          fi
          if ! [[ "${release_version}" =~ ^v0[.][0-9]{2}$ ]]; then
            echo "::error::Release version must look like v0.01."
            exit 1
          fi
          release_id="${release_version}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          echo "RELEASE_VERSION=${release_version}" >> "${GITHUB_ENV}"
          echo "RELEASE_ID=${release_id}" >> "${GITHUB_ENV}"

      - name: Load VPS deploy config
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f deploy.vps.env ]; then
            echo "::error::deploy.vps.env does not exist."
            exit 1
          fi

          allowed_keys=" APP_NAME WEB_RELEASE_SCRIPT DEPLOY_STATIC_PATHS REMOTE_APP_DIR REMOTE_RELEASES_DIR REMOTE_CURRENT_LINK REMOTE_SERVICE_NAME DEPLOY_KEEP_RELEASES PUBLIC_WEB_ROOT PUBLIC_APP_PATH PUBLIC_HEALTHCHECK_PATH "
          while IFS= read -r line || [ -n "${line}" ]; do
            line="${line%$'\r'}"
            if [ -z "${line}" ] || [[ "${line}" == \#* ]]; then
              continue
            fi
            key="${line%%=*}"
            value="${line#*=}"
            if [[ ! "${key}" =~ ^[A-Z0-9_]+$ ]]; then
              echo "::error::Invalid deploy config key: ${key}"
              exit 1
            fi
            if [[ "${allowed_keys}" != *" ${key} "* ]]; then
              echo "::error::Unsupported deploy config key: ${key}"
              exit 1
            fi
            printf '%s=%s\n' "${key}" "${value}" >> "${GITHUB_ENV}"
          done < deploy.vps.env

      - name: Validate VPS deploy config
        shell: bash
        run: |
          set -euo pipefail
          for key in APP_NAME WEB_RELEASE_SCRIPT DEPLOY_STATIC_PATHS REMOTE_APP_DIR REMOTE_RELEASES_DIR REMOTE_CURRENT_LINK DEPLOY_KEEP_RELEASES; do
            if [ -z "${!key:-}" ]; then
              echo "::error::${key} must be set in deploy.vps.env."
              exit 1
            fi
          done
          if ! [[ "${DEPLOY_KEEP_RELEASES}" =~ ^[0-9]+$ ]]; then
            echo "::error::DEPLOY_KEEP_RELEASES must be a non-negative integer."
            exit 1
          fi
          if [ -n "${PUBLIC_WEB_ROOT:-}" ] || [ -n "${PUBLIC_APP_PATH:-}" ]; then
            if [ -z "${PUBLIC_WEB_ROOT:-}" ] || [ -z "${PUBLIC_APP_PATH:-}" ]; then
              echo "::error::PUBLIC_WEB_ROOT and PUBLIC_APP_PATH must either both be set or both be blank."
              exit 1
            fi
            if [[ "${PUBLIC_APP_PATH}" == /* ]] || [[ "${PUBLIC_APP_PATH}" == *..* ]]; then
              echo "::error::PUBLIC_APP_PATH must be a relative path without '..'."
              exit 1
            fi
          fi
          if [ -z "${PUBLIC_HEALTHCHECK_PATH:-}" ]; then
            echo "PUBLIC_HEALTHCHECK_PATH=/" >> "${GITHUB_ENV}"
          elif [[ "${PUBLIC_HEALTHCHECK_PATH}" != /* ]] || [[ "${PUBLIC_HEALTHCHECK_PATH}" == *..* ]]; then
            echo "::error::PUBLIC_HEALTHCHECK_PATH must start with '/' and must not contain '..'."
            exit 1
          fi
          IFS=',' read -ra static_path_entries <<< "${DEPLOY_STATIC_PATHS}"
          for entry in "${static_path_entries[@]}"; do
            source_path="${entry%%|*}"
            public_path="${entry#*|}"
            if [ -z "${source_path}" ] || [ -z "${public_path}" ] || [ "${source_path}" = "${entry}" ]; then
              echo "::error::Each DEPLOY_STATIC_PATHS entry must look like local/source|/public/path/."
              exit 1
            fi
            if [[ "${source_path}" == /* ]] || [[ "${source_path}" == *..* ]]; then
              echo "::error::DEPLOY_STATIC_PATHS source paths must be relative paths without '..'."
              exit 1
            fi
            if [[ "${public_path}" != /* ]] || [[ "${public_path}" == *..* ]]; then
              echo "::error::DEPLOY_STATIC_PATHS public paths must start with '/' and must not contain '..'."
              exit 1
            fi
          done

      - name: Validate VPS SSH secrets and connectivity
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          for key in VPS_HOST VPS_KNOWN_HOSTS VPS_SSH_PRIVATE_KEY VPS_SSH_PORT VPS_USER; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Repository secret ${key} must be set."
              exit 1
            fi
          done

          if ! [[ "${VPS_SSH_PORT}" =~ ^[0-9]+$ ]] || [ "${VPS_SSH_PORT}" -lt 1 ] || [ "${VPS_SSH_PORT}" -gt 65535 ]; then
            echo "::error::Repository secret VPS_SSH_PORT must be a TCP port number from 1 to 65535."
            exit 1
          fi

          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          printf '%s\n' "${VPS_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/vps_deploy_key"
          chmod 600 "${HOME}/.ssh/vps_deploy_key"
          printf '%s\n' "${VPS_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

          if ! ssh-keygen -l -f "${HOME}/.ssh/vps_deploy_key" > /dev/null; then
            echo "::error::Repository secret VPS_SSH_PRIVATE_KEY is not a valid SSH private key or requires unsupported input."
            exit 1
          fi

          if ! ssh-keygen -l -f "${HOME}/.ssh/known_hosts" > /dev/null; then
            echo "::error::Repository secret VPS_KNOWN_HOSTS does not contain valid SSH known_hosts entries."
            exit 1
          fi

          ssh -p "${VPS_SSH_PORT}" \
            -i "${HOME}/.ssh/vps_deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o IdentitiesOnly=yes \
            -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes \
            "${VPS_USER}@${VPS_HOST}" \
            "printf '%s\n' vps-preflight-ok"

          ssh -p "${VPS_SSH_PORT}" \
            -i "${HOME}/.ssh/vps_deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o IdentitiesOnly=yes \
            -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes \
            "${VPS_USER}@${VPS_HOST}" \
            bash -s -- \
              "${REMOTE_APP_DIR}" \
              "${REMOTE_RELEASES_DIR}" \
              "${PUBLIC_WEB_ROOT:-}" <<'REMOTE_PREFLIGHT'
          set -euo pipefail

          remote_app_dir="$1"
          remote_releases_dir="$2"
          public_web_root="$3"
          release_parent="${remote_app_dir%/}/${remote_releases_dir}"

          case "${release_parent}" in
            "${remote_app_dir%/}"/*) ;;
            *)
              echo "Release path must stay under the remote app directory." >&2
              exit 1
              ;;
          esac

          if [ -d "${release_parent}" ]; then
            test -w "${release_parent}" || {
              echo "Deploy user cannot write to existing release folder: ${release_parent}" >&2
              exit 1
            }
          elif [ -d "${remote_app_dir}" ]; then
            test -w "${remote_app_dir}" || {
              echo "Deploy user cannot create releases under app folder: ${remote_app_dir}" >&2
              exit 1
            }
          else
            remote_parent="$(dirname "${remote_app_dir}")"
            test -d "${remote_parent}" && test -w "${remote_parent}" || {
              echo "Deploy app folder is missing and deploy user cannot create it under: ${remote_parent}" >&2
              exit 1
            }
          fi

          if [ -n "${public_web_root}" ]; then
            test -d "${public_web_root}" && test -w "${public_web_root}" || {
              echo "Public web root is missing or not writable by deploy user: ${public_web_root}" >&2
              echo "Run scripts/vps/InstallStaticWebRouter.sh once on the VPS." >&2
              exit 1
            }
          fi
          REMOTE_PREFLIGHT

      - name: Install Rust wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.121 --locked

      - name: Validate source asset casing
        shell: bash
        run: |
          set -euo pipefail
          test -f bevy/crates/game/assets/cards/card_types/card_type_skybolt/title_skybolt.png
          test -f bevy/crates/game/assets/cards/card_types/card_type_tar/title_tar.png
          if grep -RE "Card(Themes|Theme_)|card_(themes|theme_)|cards/Card|Cards/Card" bevy/crates/game/src; then
            echo "::error::Card type asset paths must use lowercase snake_case assets/cards/... paths for web release builds."
            exit 1
          fi

      - name: Export release web bundle
        shell: pwsh
        run: |
          & $env:WEB_RELEASE_SCRIPT
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Prepare static deploy payload
        shell: bash
        run: |
          set -euo pipefail
          staging_dir="target/vps-static-deploy"
          rm -rf "${staging_dir}"
          mkdir -p "${staging_dir}"

          IFS=',' read -ra static_path_entries <<< "${DEPLOY_STATIC_PATHS}"
          for entry in "${static_path_entries[@]}"; do
            source_path="${entry%%|*}"
            public_path="${entry#*|}"
            public_path="${public_path#/}"
            public_path="${public_path%/}"

            test -d "${source_path}"
            if [ -z "${public_path}" ]; then
              destination_path="${staging_dir}"
            else
              destination_path="${staging_dir}/${public_path}"
              mkdir -p "${destination_path}"
            fi
            cp -a "${source_path}/." "${destination_path}/"
          done

          test -f "${staging_dir}/index.html"
          test -f "${staging_dir}/404.html"
          find "${staging_dir}" -maxdepth 1 -name 'samurai_card_game_bg.wasm' -print -quit | grep -q .
          echo "STATIC_DEPLOY_STAGING=${staging_dir}" >> "${GITHUB_ENV}"

      - name: Create release archive
        shell: bash
        run: |
          set -euo pipefail
          tar -C "${STATIC_DEPLOY_STAGING}" -czf web-release.tar.gz .

      - name: Upload release archive
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          archive_name="${APP_NAME}-${RELEASE_ID}.tar.gz"
          scp -P "${VPS_SSH_PORT}" \
            -i "${HOME}/.ssh/vps_deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            web-release.tar.gz \
            "${VPS_USER}@${VPS_HOST}:/tmp/${archive_name}"
          echo "REMOTE_ARCHIVE=/tmp/${archive_name}" >> "${GITHUB_ENV}"

      - name: Activate VPS release
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -p "${VPS_SSH_PORT}" \
            -i "${HOME}/.ssh/vps_deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${VPS_USER}@${VPS_HOST}" \
            bash -s -- \
              "${REMOTE_APP_DIR}" \
              "${REMOTE_RELEASES_DIR}" \
              "${REMOTE_CURRENT_LINK}" \
              "${DEPLOY_KEEP_RELEASES}" \
              "${RELEASE_ID}" \
              "${REMOTE_ARCHIVE}" \
              "${PUBLIC_WEB_ROOT:-}" \
              "${PUBLIC_APP_PATH:-}" \
              "${RELEASE_VERSION}" \
              "${REMOTE_SERVICE_NAME}" <<'REMOTE_SCRIPT'
          set -euo pipefail

          remote_app_dir="$1"
          remote_releases_dir="$2"
          remote_current_link="$3"
          deploy_keep_releases="$4"
          release_id="$5"
          remote_archive="$6"
          public_web_root="${7-}"
          public_app_path="${8-}"
          release_version="${9-}"
          remote_service_name="${10-}"

          release_parent="${remote_app_dir%/}/${remote_releases_dir}"
          release_dir="${release_parent}/${release_id}"
          current_link="${remote_app_dir%/}/${remote_current_link}"

          case "${release_parent}" in
            "${remote_app_dir%/}"/*) ;;
            *)
              echo "Release path must stay under the remote app directory." >&2
              exit 1
              ;;
          esac

          mkdir -p "${release_parent}"
          if [ -e "${release_dir}" ]; then
            echo "Release already exists: ${release_dir}" >&2
            exit 1
          fi
          mkdir -p "${release_dir}"
          tar -xzf "${remote_archive}" -C "${release_dir}"
          ln -sfn "${remote_releases_dir}/${release_id}" "${current_link}"
          rm -f "${remote_archive}"

          if [ -n "${public_web_root}" ] && [ -n "${public_app_path}" ]; then
            public_app_dir="${public_web_root%/}/${public_app_path}"
            case "${public_app_dir}" in
              "${public_web_root%/}"/*) ;;
              *)
                echo "Public app path must stay under the public web root." >&2
                exit 1
                ;;
            esac

            if [ -L "${public_app_dir}" ]; then
              rm -f "${public_app_dir}"
            fi
            mkdir -p "${public_app_dir}"
            find "${public_app_dir}" -mindepth 1 -maxdepth 1 \
              ! -name latest \
              ! -name 'v*' \
              -exec rm -rf {} +
            cp -a "${release_dir}/." "${public_app_dir}/"
            ln -sfn "${release_dir}" "${public_app_dir}/latest"
            ln -sfn "${release_dir}" "${public_app_dir}/${release_version}"
          fi

          if [ -n "${remote_service_name}" ]; then
            sudo systemctl restart "${remote_service_name}"
          fi

          if [ "${deploy_keep_releases}" -gt 0 ]; then
            mapfile -t old_releases < <(
              find "${release_parent}" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' |
                sort -rn |
                awk -v keep="${deploy_keep_releases}" 'NR > keep { first = index($0, " "); print substr($0, first + 1) }'
            )
            for old_release in "${old_releases[@]}"; do
              case "${old_release}" in
                "${release_parent}"/*) rm -rf "${old_release}" ;;
                *)
                  echo "Refusing to prune unexpected path: ${old_release}" >&2
                  exit 1
                  ;;
              esac
            done
          fi

          echo "Activated ${release_id} at ${current_link}"
          REMOTE_SCRIPT

      - name: Verify public browser URL
        if: ${{ env.PUBLIC_APP_PATH != '' }}
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          latest_root_path="/${PUBLIC_APP_PATH%/}${PUBLIC_HEALTHCHECK_PATH}"
          latest_alias_path="/${PUBLIC_APP_PATH%/}/latest${PUBLIC_HEALTHCHECK_PATH}"
          version_path="/${PUBLIC_APP_PATH%/}/${RELEASE_VERSION}${PUBLIC_HEALTHCHECK_PATH}"

          for public_path in "${latest_root_path}" "${latest_alias_path}" "${version_path}"; do
            status_code="$(
              curl \
                --connect-timeout 10 \
                --max-time 30 \
                --output /dev/null \
                --silent \
                --show-error \
                --write-out '%{http_code}' \
                "http://${VPS_HOST}${public_path}"
            )"

            if [ "${status_code}" != "200" ]; then
              echo "::error::Public VPS URL returned HTTP ${status_code} for path ${public_path}."
              exit 1
            fi
          done

          echo "PUBLIC_URL_PATH=${latest_root_path}" >> "${GITHUB_ENV}"
          echo "PUBLIC_LATEST_URL_PATH=${latest_alias_path}" >> "${GITHUB_ENV}"
          echo "PUBLIC_VERSION_URL_PATH=${version_path}" >> "${GITHUB_ENV}"

      - name: Write deployment summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## VPS deployment"
            echo ""
            echo "Activated release \`${RELEASE_ID}\`."
            if [ -n "${PUBLIC_APP_PATH:-}" ]; then
              echo ""
              echo "Public path: \`${PUBLIC_URL_PATH:-/${PUBLIC_APP_PATH%/}/}\`"
              echo "Latest alias: \`${PUBLIC_LATEST_URL_PATH:-/${PUBLIC_APP_PATH%/}/latest/}\`"
              echo "Version path: \`${PUBLIC_VERSION_URL_PATH:-/${PUBLIC_APP_PATH%/}/${RELEASE_VERSION}/}\`"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
